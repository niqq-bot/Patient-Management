info:
  name: update patient
  type: http
  seq: 3

http:
  method: PUT
  url: localhost:4000/patients/{{id}}
  body:
    type: json
    data: |-
      {
          "address": "123 Main St, Springfieldddd",
          "dateOfBirth": "1985-06-15",
          "email": "john.doe@examplee.com",
          "name": "John Doe"
        }
  auth: inherit

runtime:
  variables:
    - name: id
      value: 337d4390-5cb8-47e4-b1f0-2486d347fde4

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
